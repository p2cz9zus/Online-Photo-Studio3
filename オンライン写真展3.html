<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温度 - Online Photo Exhibition</title>
    <style>
        :root { --font-main: "Hiragino Mincho ProN", "MS Mincho", serif; }
        
        body { 
            margin: 0; 
            background: #000; 
            color: #fff; 
            font-family: var(--font-main); 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        /* 画面全体の質感：ノイズ */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.05;
            pointer-events: none;
            z-index: 100;
        }

        /* プログレスカウンター */
        .counter {
            position: fixed;
            bottom: 40px;
            right: 40px;
            font-size: 0.8rem;
            letter-spacing: 0.3rem;
            z-index: 50;
            font-family: sans-serif;
            opacity: 0.6;
        }

        section { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
            text-align: center;
            position: relative;
        }
        
        .hero h1 { 
            font-size: clamp(3rem, 12vw, 8rem); 
            letter-spacing: 2rem; 
            margin-right: -2rem; 
            font-weight: 200; 
            transition: color 1s ease;
        }

        .concept-section { background: transparent; z-index: 5; }
        .concept-content { max-width: 650px; padding: 0 40px; }
        .concept-content h2 { font-size: 1.5rem; letter-spacing: 0.8rem; margin-bottom: 3rem; font-weight: 300; }
        .concept-content p { font-size: 1rem; line-height: 3; opacity: 0.8; font-weight: 300; }

        .gallery-space { height: 900vh; } 

        .about { 
            padding: 30vh 20px; 
            line-height: 3; 
            background: #000; 
            z-index: 10;
            position: relative;
        }
        .about h2 { font-size: 1.5rem; letter-spacing: 0.5rem; margin-bottom: 3rem; font-weight: 300; }
    </style>
</head>
<body>

    <div class="counter" id="scroll-counter">01 / 08</div>

    <section class="hero">
        <h1 id="main-title">温度</h1>
    </section>

    <section class="concept-section">
        <div class="concept-content">
            <h2>テーマ：温度</h2>
            <p>
                目に見えるものは、すべて熱を持っている。<br>
                凍てつく空気の青さ、肌に触れる夕陽の残熱、<br>
                そして静寂の中に宿る、情熱という名の火。<br>
                この展示では、光が運ぶ「温度」の機微を、<br>
                8つの断片を通して描き出します。
            </p>
        </div>
    </section>

    <div class="gallery-space"></div>

    <section class="about">
        <h2>About Us</h2>
        <p>
            感覚を可視化するクリエイティブチーム。<br>
            光の粒子が持つ固有の熱を記録した習作群。<br>
            スクロールという行為による空間の変容を。
        </p>
    </section>

    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>

    <script>
        const photoData = [
            { color: '#FF3D00', bg: '#0a0503' }, { color: '#00E5FF', bg: '#03080a' },
            { color: '#FFD600', bg: '#0a0903' }, { color: '#FFFFFF', bg: '#050505' },
            { color: '#D50000', bg: '#0a0303' }, { color: '#2979FF', bg: '#03040a' },
            { color: '#FFAB91', bg: '#0a0706' }, { color: '#1DE9B6', bg: '#030a08' }
        ];

        let targetScroll = 0;
        let currentScroll = 0;
        let currentIndex = 0;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.getElementById('container').appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();
        const textures = [];
        let mesh;

        // 初期化
        async function init() {
            const loadTexture = (path) => new Promise(res => loader.load(path, res));
            
            for (let i = 1; i <= 8; i++) {
                const tex = await loadTexture(`./img/0${i}.jpg`);
                tex.encoding = THREE.sRGBEncoding;
                textures.push(tex);
            }
            createMesh(textures[0]);
            animate();
        }

        function createMesh(tex) {
            const aspect = tex.image.width / tex.image.height;
            const geo = new THREE.PlaneGeometry(5 * aspect, 5);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: false });
            mesh = new THREE.Mesh(geo, mat);
            scene.add(mesh);
        }

        window.addEventListener('scroll', () => {
            targetScroll = window.scrollY;
        });

        function updateGallery(index) {
            if (index === currentIndex) return;
            currentIndex = index;
            const data = photoData[currentIndex];

            // 背景と色の切り替え
            gsap.to(document.body, { backgroundColor: data.bg, duration: 1.2 });
            gsap.to("#main-title", { color: data.color, duration: 0.8 });
            document.getElementById('scroll-counter').innerText = `0${currentIndex + 1} / 08`;

            // 写真の比率を更新
            mesh.material.map = textures[currentIndex];
            const aspect = textures[currentIndex].image.width / textures[currentIndex].image.height;
            mesh.geometry.dispose();
            mesh.geometry = new THREE.PlaneGeometry(5 * aspect, 5);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 慣性スクロールの実装
            currentScroll += (targetScroll - currentScroll) * 0.08;
            
            const scrollTotal = document.body.scrollHeight - window.innerHeight;
            const progress = Math.max(0, (currentScroll - window.innerHeight * 1.5) / (scrollTotal - window.innerHeight * 2));
            
            if (mesh) {
                // エフェクトなし、純粋な切り替え
                const activeIndex = Math.min(Math.floor(progress * photoData.length), photoData.length - 1);
                if (progress > 0 && progress < 1) {
                    mesh.visible = true;
                    updateGallery(activeIndex);
                } else {
                    mesh.visible = (progress <= 0) ? false : true;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
